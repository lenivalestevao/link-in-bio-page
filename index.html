<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Name — Links</title>
  <meta name="description" content="All my important links in one place.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <div class="topbar">
      <div class="themes" id="themes" role="group" aria-label="Choose theme"></div>
      <button id="shareBtn" class="share" aria-label="Share this page">Share</button>
    </div>

    <header class="profile">
      <div class="avatar" id="avatar" aria-hidden="true">YN</div>
      <h1 id="name">Your Name</h1>
      <p id="handle" class="handle">@yourhandle</p>
      <p id="bio" class="bio">Creator, developer and coffee enthusiast. Sharing what I build and learn.</p>
      <ul id="socials" class="socials"></ul>
    </header>

    <nav id="links" class="links" aria-label="My links"></nav>

    <footer class="foot">
      <p>Free template by <a href="https://github.com/lenivalestevao" target="_blank" rel="noopener">Leni Junior</a></p>
    </footer>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
